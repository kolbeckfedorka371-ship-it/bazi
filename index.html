<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万象合参 - AI命理分析系统</title>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a2e;--blue:#3b82f6;--cyan:#06b6d4;--purple:#8b5cf6;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--border:rgba(59,130,246,.15);--glass:rgba(26,26,46,.7);--glass2:rgba(59,130,246,.08)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(150px);opacity:.15;pointer-events:none;z-index:0}
.glow-1{background:var(--blue);top:-200px;right:-200px}
.glow-2{background:var(--purple);bottom:-200px;left:-200px}
.container{max-width:1200px;margin:0 auto;padding:20px;position:relative;z-index:1}

/* Header */
.header{text-align:center;padding:60px 0 40px}
.header h1{font-size:2.5rem;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:4px}
.header p{color:var(--text2);font-size:.95rem;letter-spacing:2px}

/* Glass Card */
.card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:32px;transition:all .3s}
.card:hover{border-color:rgba(59,130,246,.3)}

/* Input Form */
.form-section{max-width:560px;margin:0 auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:.85rem;color:var(--text2);font-weight:500}
.form-group input,.form-group select{background:rgba(10,10,15,.6);border:1px solid rgba(100,116,139,.2);border-radius:10px;padding:12px 16px;color:var(--text);font-size:.95rem;outline:none;transition:border .2s}
.form-group input:focus,.form-group select:focus{border-color:var(--blue)}
.form-group select option{background:#1a1a2e}
.btn-analyze{width:100%;margin-top:24px;padding:14px;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;border-radius:12px;color:#fff;font-size:1.05rem;font-weight:600;cursor:pointer;letter-spacing:2px;transition:all .3s;position:relative;overflow:hidden}
.btn-analyze:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(59,130,246,.3)}
.btn-analyze:disabled{opacity:.6;cursor:not-allowed;transform:none}

/* Loading */
.loading-screen{display:none;text-align:center;padding:80px 0}
.loading-screen.active{display:block}
.spinner{width:60px;height:60px;border:3px solid rgba(59,130,246,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 32px}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-steps{text-align:left;max-width:320px;margin:0 auto}
.step{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--text3);font-size:.9rem;transition:all .3s}
.step.active{color:var(--cyan)}
.step.done{color:var(--text2)}
.step-icon{width:24px;height:24px;border-radius:50%;border:2px solid var(--text3);display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0;transition:all .3s}
.step.active .step-icon{border-color:var(--cyan);color:var(--cyan);animation:pulse 1s infinite}
.step.done .step-icon{border-color:#10b981;background:#10b981;color:#fff}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(6,182,212,.4)}50%{box-shadow:0 0 0 8px rgba(6,182,212,0)}}

/* Results Layout */
.results-screen{display:none}
.results-screen.active{display:block}
.confidence-bar{text-align:center;margin-bottom:24px}
.confidence-bar .score{font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.confidence-bar .label{color:var(--text2);font-size:.85rem;margin-top:4px}

.results-main{display:grid;grid-template-columns:180px 1fr;gap:20px;margin-bottom:24px}
@media(max-width:768px){.results-main{grid-template-columns:1fr}}

/* Method Tabs */
.method-tabs{display:flex;flex-direction:column;gap:8px}
.method-tab{padding:12px 16px;border-radius:10px;background:transparent;border:1px solid rgba(100,116,139,.15);color:var(--text2);cursor:pointer;font-size:.85rem;text-align:center;transition:all .2s}
.method-tab:hover{background:var(--glass2);border-color:var(--border)}
.method-tab.active{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(6,182,212,.1));border-color:var(--blue);color:var(--cyan)}

/* Detail Panel */
.detail-panel{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:28px;min-height:400px;max-height:70vh;overflow-y:auto}
.detail-panel::-webkit-scrollbar{width:4px}
.detail-panel::-webkit-scrollbar-thumb{background:rgba(59,130,246,.3);border-radius:2px}
.detail-title{font-size:1.2rem;font-weight:600;color:var(--cyan);margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.detail-section{margin-bottom:20px}
.detail-section h4{font-size:.9rem;color:var(--blue);margin-bottom:10px;font-weight:600}
.detail-row{display:flex;gap:8px;padding:6px 0;font-size:.88rem;border-bottom:1px solid rgba(100,116,139,.08)}
.detail-row .label{color:var(--text3);min-width:80px;flex-shrink:0}
.detail-row .value{color:var(--text)}
.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:.78rem;margin:2px}
.tag-blue{background:rgba(59,130,246,.15);color:var(--blue)}
.tag-cyan{background:rgba(6,182,212,.15);color:var(--cyan)}
.tag-purple{background:rgba(139,92,246,.15);color:var(--purple)}
.tag-green{background:rgba(16,185,129,.15);color:#10b981}
.tag-yellow{background:rgba(245,158,11,.15);color:#f59e0b}
.tag-red{background:rgba(239,68,68,.15);color:#ef4444}

/* Pillar Grid */
.pillar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.pillar-cell{text-align:center;background:rgba(10,10,15,.5);border:1px solid var(--border);border-radius:10px;padding:12px 8px}
.pillar-cell .pillar-label{font-size:.72rem;color:var(--text3);margin-bottom:6px}
.pillar-cell .pillar-tg{font-size:1.1rem;font-weight:700;margin-bottom:2px}
.pillar-cell .pillar-dz{font-size:1.1rem;font-weight:700}
.element-bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Star Grid for Zi Wei */
.star-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.star-cell{background:rgba(10,10,15,.5);border:1px solid var(--border);border-radius:8px;padding:10px;min-height:80px;font-size:.78rem}
.star-cell .palace-name{color:var(--cyan);font-weight:600;font-size:.82rem;margin-bottom:4px}
.star-cell .star-name{color:#f59e0b}

/* Hexagram */
.hexagram-display{text-align:center;margin:20px 0}
.hexagram-line{height:8px;margin:6px auto;width:120px;position:relative}
.hexagram-line.yang{background:var(--blue)}
.hexagram-line.yin{display:flex;justify-content:space-between}
.hexagram-line.yin span{width:45%;height:100%;background:var(--blue)}

/* Tarot Cards */
.tarot-spread{display:flex;justify-content:center;gap:20px;margin:20px 0;flex-wrap:wrap}
.tarot-card{text-align:center;width:120px;perspective:800px}
.tarot-card .card-inner{width:100px;height:140px;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,0,.2,1);cursor:pointer;margin:0 auto}
.tarot-card .card-inner.flipped{transform:rotateY(180deg)}
.tarot-card .card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.tarot-card .card-back{background:linear-gradient(135deg,rgba(139,92,246,.3),rgba(59,130,246,.3));border:1px solid var(--purple)}
.tarot-card .card-front{background:linear-gradient(135deg,rgba(26,26,46,.95),rgba(59,130,246,.15));border:1px solid var(--cyan);transform:rotateY(180deg);flex-direction:column;padding:8px;font-size:.85rem}
.tarot-card .card-pos{font-size:.75rem;color:var(--text3);margin-bottom:4px}
.tarot-card .card-name{font-size:.82rem;color:var(--cyan);font-weight:600;margin-top:4px}
.tarot-card .card-meaning{font-size:.72rem;color:var(--text3);margin-top:4px}

/* Tarot Grid */
.tarot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin:16px 0;max-height:400px;overflow-y:auto;padding:4px}
.tarot-grid::-webkit-scrollbar{width:4px}
.tarot-grid::-webkit-scrollbar-thumb{background:rgba(59,130,246,.3);border-radius:2px}
.tarot-mini{width:100%;aspect-ratio:2/3;background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(59,130,246,.2));border:1px solid rgba(139,92,246,.3);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:all .2s;position:relative}
.tarot-mini:hover{border-color:var(--cyan);transform:translateY(-2px)}
.tarot-mini.selected{border-color:var(--cyan);box-shadow:0 0 12px rgba(6,182,212,.3)}
.tarot-mini .mini-label{position:absolute;bottom:2px;font-size:.55rem;color:var(--text3);text-align:center;width:100%;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Calendar Items */
.calendar-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.calendar-item{background:rgba(10,10,15,.4);border:1px solid var(--border);border-radius:8px;padding:12px}
.calendar-item h5{font-size:.85rem;color:var(--cyan);margin-bottom:6px}
.calendar-item p{font-size:.8rem;color:var(--text2)}

/* AI Chat Section */
.chat-section{margin-top:24px}
.chat-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;height:600px}
.chat-header{display:flex;align-items:center;gap:10px;padding:20px 24px;border-bottom:1px solid var(--border)}
.chat-header h3{font-size:1.1rem;font-weight:600;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chat-header .ai-badge{padding:3px 10px;border-radius:6px;background:rgba(59,130,246,.15);color:var(--blue);font-size:.72rem}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:rgba(59,130,246,.3);border-radius:2px}
.chat-msg{max-width:85%;padding:12px 16px;border-radius:12px;font-size:.9rem;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(6,182,212,.15));border:1px solid rgba(59,130,246,.2)}
.chat-msg.ai{align-self:flex-start;background:rgba(10,10,15,.6);border:1px solid rgba(100,116,139,.15)}
.chat-msg .cursor{display:inline-block;width:2px;height:14px;background:var(--cyan);animation:blink 1s infinite;vertical-align:middle;margin-left:2px}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.chat-quick{display:flex;gap:8px;padding:0 24px 12px;flex-wrap:wrap}
.chat-quick-btn{padding:6px 14px;border-radius:20px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);color:var(--text2);font-size:.78rem;cursor:pointer;transition:all .2s}
.chat-quick-btn:hover{background:rgba(59,130,246,.2);color:var(--cyan);border-color:var(--blue)}
.chat-input-area{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--border)}
.chat-input-area input{flex:1;background:rgba(10,10,15,.6);border:1px solid rgba(100,116,139,.2);border-radius:10px;padding:12px 16px;color:var(--text);font-size:.9rem;outline:none;transition:border .2s}
.chat-input-area input:focus{border-color:var(--blue)}
.chat-send-btn{padding:12px 20px;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;border-radius:10px;color:#fff;font-size:.9rem;cursor:pointer;transition:all .2s;font-weight:500}
.chat-send-btn:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(59,130,246,.3)}
.chat-send-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* AI Analysis (results screen) */
.ai-section{margin-top:24px}
.ai-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;padding:28px}
.ai-header{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.ai-header h3{font-size:1.1rem;font-weight:600;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ai-header .ai-badge{padding:3px 10px;border-radius:6px;background:rgba(59,130,246,.15);color:var(--blue);font-size:.72rem}
.ai-content{font-size:.9rem;line-height:1.8;color:var(--text2);white-space:pre-wrap;min-height:100px}

/* Interactive Buttons */
.btn-interactive{padding:16px 40px;background:linear-gradient(135deg,var(--blue),var(--cyan));border:none;border-radius:14px;color:#fff;font-size:1.05rem;font-weight:600;cursor:pointer;letter-spacing:2px;transition:all .3s;display:inline-block}
.btn-interactive:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(59,130,246,.4)}
.btn-retry{margin-top:16px;padding:10px 28px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text2);cursor:pointer;font-size:.85rem;transition:all .2s}
.btn-retry:hover{border-color:var(--blue);color:var(--cyan)}
.interactive-center{text-align:center;padding:40px 0}
.interactive-prompt{color:var(--text2);font-size:.95rem;margin:20px 0;line-height:1.6}

/* Coin animation */
.coin-area{display:flex;justify-content:center;gap:16px;margin:24px 0;flex-wrap:wrap}
.coin{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;transition:all .3s;border:2px solid}
.coin.yin{background:rgba(6,182,212,.15);border-color:var(--cyan);color:var(--cyan)}
.coin.yang{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue)}
.coin.flipping{animation:coinFlip .5s ease-in-out}
@keyframes coinFlip{0%{transform:rotateY(0)}50%{transform:rotateY(180deg) scale(1.2)}100%{transform:rotateY(360deg)}}

/* Meihua numbers animation */
.meihua-numbers{display:flex;justify-content:center;gap:20px;margin:24px 0}
.meihua-num{width:70px;height:70px;border-radius:14px;background:rgba(10,10,15,.5);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:var(--cyan);transition:all .5s}
.meihua-num.revealed{border-color:var(--cyan);box-shadow:0 0 20px rgba(6,182,212,.2)}

/* Liuyao progress */
.liuyao-progress{display:flex;gap:8px;justify-content:center;margin:16px 0}
.liuyao-dot{width:10px;height:10px;border-radius:50%;background:rgba(100,116,139,.2);transition:all .3s}
.liuyao-dot.done{background:var(--cyan);box-shadow:0 0 8px rgba(6,182,212,.4)}

/* Back Button */
.btn-back{margin-top:20px;padding:10px 24px;background:transparent;border:1px solid var(--border);border-radius:10px;color:var(--text2);cursor:pointer;font-size:.85rem;transition:all .2s}
.btn-back:hover{border-color:var(--blue);color:var(--cyan)}

/* Top Nav */
.top-nav{display:flex;justify-content:center;gap:12px;margin-bottom:30px}
.nav-btn{padding:10px 24px;border-radius:10px;background:transparent;border:1px solid rgba(100,116,139,.15);color:var(--text2);cursor:pointer;font-size:.9rem;transition:all .2s}
.nav-btn:hover{background:var(--glass2);border-color:var(--border)}
.nav-btn.active{background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(6,182,212,.1));border-color:var(--blue);color:var(--cyan)}

/* Spread Selector */
.spread-selector{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.spread-btn{padding:8px 20px;border-radius:8px;background:rgba(10,10,15,.5);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:.85rem;transition:all .2s}
.spread-btn:hover{border-color:var(--blue);color:var(--cyan)}
.spread-btn.active{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--cyan)}

/* ===== 万年历 Calendar ===== */
.wnl-container{padding:8px 0}
.wnl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.wnl-header h3{font-size:1.1rem;color:var(--cyan);font-weight:600}
.wnl-nav{display:flex;gap:8px}
.wnl-nav button{width:36px;height:36px;border-radius:8px;background:rgba(10,10,15,.5);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.wnl-nav button:hover{border-color:var(--blue);color:var(--cyan)}
.wnl-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.wnl-weekday{text-align:center;padding:8px 0;font-size:.78rem;color:var(--text3);font-weight:600}
.wnl-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wnl-day{background:rgba(10,10,15,.4);border:1px solid rgba(100,116,139,.1);border-radius:8px;padding:6px 4px;min-height:72px;cursor:pointer;transition:all .2s;text-align:center}
.wnl-day:hover{border-color:var(--blue);background:rgba(59,130,246,.08)}
.wnl-day.today{border-color:var(--cyan);box-shadow:0 0 12px rgba(6,182,212,.15)}
.wnl-day.selected{border-color:var(--blue);background:rgba(59,130,246,.12)}
.wnl-day.other-month{opacity:.35}
.wnl-day .solar-date{font-size:.9rem;font-weight:600;color:var(--text);line-height:1.2}
.wnl-day.today .solar-date{color:var(--cyan)}
.wnl-day .lunar-date{font-size:.65rem;color:var(--text3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wnl-day .yi-ji-dots{display:flex;gap:2px;justify-content:center;margin-top:3px}
.wnl-day .yi-dot{width:4px;height:4px;border-radius:50%;background:#10b981}
.wnl-day .ji-dot{width:4px;height:4px;border-radius:50%;background:#ef4444}
.wnl-detail{margin-top:16px;background:rgba(10,10,15,.5);border:1px solid var(--border);border-radius:12px;padding:20px;display:none}
.wnl-detail.active{display:block}
.wnl-detail-header{text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.wnl-detail-header .big-date{font-size:1.5rem;font-weight:700;color:var(--cyan)}
.wnl-detail-header .lunar-full{font-size:.9rem;color:var(--text2);margin-top:4px}
.wnl-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wnl-detail-item{background:rgba(26,26,46,.5);border-radius:8px;padding:12px}
.wnl-detail-item h5{font-size:.8rem;color:var(--blue);margin-bottom:6px}
.wnl-detail-item p{font-size:.82rem;color:var(--text2);line-height:1.6}
.wnl-yi-list,.wnl-ji-list{display:flex;flex-wrap:wrap;gap:4px}
.wnl-yi-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.72rem;background:rgba(16,185,129,.15);color:#10b981}
.wnl-ji-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.72rem;background:rgba(239,68,68,.15);color:#ef4444}

/* ===== 袁天罡称骨 ===== */
.bone-weight-card{background:rgba(10,10,15,.5);border:1px solid var(--border);border-radius:12px;padding:20px;margin-top:16px;text-align:center}
.bone-weight-result{font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--blue),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:12px 0 8px}
.bone-weight-label{font-size:.85rem;color:var(--text3);margin-bottom:16px}
.bone-detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.bone-detail-cell{background:rgba(26,26,46,.5);border-radius:8px;padding:10px 6px;text-align:center}
.bone-detail-cell .bone-label{font-size:.7rem;color:var(--text3);margin-bottom:4px}
.bone-detail-cell .bone-value{font-size:.82rem;color:var(--cyan);font-weight:600}
.bone-detail-cell .bone-weight{font-size:.72rem;color:var(--text2);margin-top:2px}
.bone-poem{background:rgba(59,130,246,.06);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px;text-align:left}
.bone-poem h5{font-size:.85rem;color:var(--cyan);margin-bottom:8px;text-align:center}
.bone-poem p{font-size:.85rem;line-height:1.8;color:var(--text2)}

@media(max-width:768px){

          <div class="form-group">
            <label>出生月份</label>
            <input type="number" id="birthMonth" min="1" max="12" placeholder="1-12">
          </div>
          <div class="form-group">
            <label>出生日期</label>
            <input type="number" id="birthDay" min="1" max="31" placeholder="1-31">
          </div>
          <div class="form-group">
            <label>出生时辰</label>
            <select id="birthHour">
              <option value="">请选择</option>
              <option value="0">子时 (23:00-01:00)</option>
              <option value="2">丑时 (01:00-03:00)</option>
              <option value="4">寅时 (03:00-05:00)</option>
              <option value="6">卯时 (05:00-07:00)</option>
              <option value="8">辰时 (07:00-09:00)</option>
              <option value="10">巳时 (09:00-11:00)</option>
              <option value="12">午时 (11:00-13:00)</option>
              <option value="14">未时 (13:00-15:00)</option>
              <option value="16">申时 (15:00-17:00)</option>
              <option value="18">酉时 (17:00-19:00)</option>
              <option value="20">戌时 (19:00-21:00)</option>

async function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg || chatStreaming) return;

  input.value = '';
  const messagesDiv = document.getElementById('chatMessages');

  // Add user message
  const userMsg = document.createElement('div');
  userMsg.className = 'chat-msg user';
  userMsg.textContent = msg;
  messagesDiv.appendChild(userMsg);

  // Add AI placeholder
  const aiMsg = document.createElement('div');
  aiMsg.className = 'chat-msg ai';
  aiMsg.innerHTML = '<span class="cursor"></span>';
  messagesDiv.appendChild(aiMsg);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;

  // Build messages array
  const systemPrompt = '你是一个专业的中国传统命理分析AI助手，精通八字命理、紫微斗数、梅花易数、六爻占卜、黄历择吉、塔罗牌解读、袁天罡称骨。你的回答专业准确、温和有智慧、300字以内、用emoji。';
  const apiMessages = [{role: 'system', content: systemPrompt}];
  // Include chat history (last 10 exchanges)
  const recentHistory = chatHistory.slice(-20);
  recentHistory.forEach(m => apiMessages.push(m));
  apiMessages.push({role: 'user', content: msg});

  chatHistory.push({role: 'user', content: msg});
  chatStreaming = true;
  document.getElementById('chatSendBtn').disabled = true;

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: API_MODEL,
        messages: apiMessages,
        stream: true,
        max_tokens: 1500,
        temperature: 0.7
      })
    });

    if (!response.ok) {
      throw new Error('API error: ' + response.status);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let text = '';
    let buffer = '';
    let inThink = false;

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;

        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          if (!delta) continue;

          // Filter think tags
          for (let i = 0; i < delta.length; i++) {
            if (delta[i] === '<') {
              if (delta.substring(i, i+7) === '<think>') { inThink = true; i += 6; continue; }
              if (delta.substring(i, i+8) === '</think>') { inThink = false; i += 7; continue; }
            }
            if (!inThink) {
              text += delta[i];
              aiMsg.innerHTML = text.replace(/\n/g, '<br>') + '<span class="cursor"></span>';
              messagesDiv.scrollTop = messagesDiv.scrollHeight;
              await new Promise(r => setTimeout(r, 20));
            }
          }
        } catch(e) {}
      }
    }

    aiMsg.innerHTML = text.replace(/\n/g, '<br>');
    chatHistory.push({role: 'assistant', content: text});
  } catch(e) {
    console.error('Chat Error:', e);
    aiMsg.innerHTML = '抱歉，AI助手暂时无法连接 😔 请稍后再试。<br><span style="font-size:.8rem;color:var(--text3)">错误：' + e.message + '</span>';
  }

  chatStreaming = false;
  document.getElementById('chatSendBtn').disabled = false;
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function calcBazi(year, month, day, hour) {

      solar = Solar.fromYmd(year, month, day);
    } else {
      return calcBaziManual(year, month, day, hour);
    }

    let lunarDate = solar.getLunar ? solar.getLunar() : null;

    }

      lunarMonth: lunarDate ? lunarDate.getMonthInChinese() : '',
      lunarDay: lunarDate ? lunarDate.getDayInChinese() : '',
      yearGanZhi: '', monthGanZhi: '', dayGanZhi: '', hourGanZhi: '',
      yearTG: '', yearDZ: '', monthTG: '', monthDZ: '', dayTG: '', dayDZ: '', hourTG: '', hourDZ: '',
      wuxing: {}, shishen: {}, nayin: {}, shengxiao: '', riyuan: '', hiddenStems: {},
      lunarMonthNum: lunarDate ? lunarDate.getMonth() : month,
      lunarDayNum: lunarDate ? lunarDate.getDay() : day

      result.monthGanZhi = eightChar.getMonth ? eightChar.getMonth() : '';

    result.shengxiao = SHENG_XIAO[DI_ZHI.indexOf(result.yearDZ)] || '';
    result.riyuan = WU_XING_GAN[riGan] || '';

    ['yearDZ','monthDZ','dayDZ','hourDZ'].forEach(k => {
      const dz = result[k];
      if (DI_ZHI_HIDDEN[dz]) {
        result.hiddenStems[k.replace('DZ','')] = DI_ZHI_HIDDEN[dz];
      }
    });

    return result;
  } catch(e) {
    console.error('BaZi library error:', e);
    return calcBaziManual(year, month, day, hour);
  }
}

function getNayin(ganzhi) {
  if (!ganzhi || ganzhi.length < 2) return '';
  const nayinTable = [
    '海中金','海中金','炉中火','炉中火','大林木','大林木','路旁土','路旁土','剑锋金','剑锋金','山头火','山头火',
    '涧下水','涧下水','城头土','城头土','白蜡金','白蜡金','杨柳木','杨柳木','泉中水','泉中水','屋上土','屋上土',
    '霹雳火','霹雳火','松柏木','松柏木','长流水','长流水','砂中金','砂中金','山下火','山下火','平地木','平地木',
    '壁上土','壁上土','金箔金','金箔金','覆灯火','覆灯火','天河水','天河水','大驿土','大驿土','钗钏金','钗钏金',
    '桑柘木','桑柘木','大溪水','大溪水','沙中土','沙中土','天上火','天上火','石榴木','石榴木','大海水','大海水'
  ];
  const ganIdx = TIAN_GAN.indexOf(ganzhi[0]);
  const zhiIdx = DI_ZHI.indexOf(ganzhi[1]);
  if (ganIdx < 0 || zhiIdx < 0) return '';
  const idx = (ganIdx * 12 + zhiIdx) % 60;
  return nayinTable[idx] || '';
}

function calcBaziManual(year, month, day, hour) {
  const yearGanIdx = (year - 4) % 10;
  const yearZhiIdx = (year - 4) % 12;
  const yearTG = TIAN_GAN[yearGanIdx];
  const yearDZ = DI_ZHI[yearZhiIdx];

  const monthGanIdx = (yearGanIdx * 2 + month) % 10;
  const monthDZIdx = (month + 1) % 12;
  const monthTG = TIAN_GAN[monthGanIdx];
  const monthDZ = DI_ZHI[monthDZIdx];

  const baseDate = new Date(1900, 0, 1);
  const targetDate = new Date(year, month - 1, day);
  const dayDiff = Math.floor((targetDate - baseDate) / 86400000);
  const dayGanIdx = (dayDiff + 10) % 10;
  const dayZhiIdx = (dayDiff + 10) % 12;
  const dayTG = TIAN_GAN[dayGanIdx];
  const dayDZ = DI_ZHI[dayZhiIdx];

  const hourZhiIdx = Math.floor((hour + 1) / 2) % 12;
  const hourGanIdx = (dayGanIdx % 5 * 2 + hourZhiIdx) % 10;
  const hourTG = TIAN_GAN[hourGanIdx];
  const hourDZ = DI_ZHI[hourZhiIdx];

  const yearGZ = yearTG + yearDZ;
  const monthGZ = monthTG + monthDZ;
  const dayGZ = dayTG + dayDZ;
  const hourGZ = hourTG + hourDZ;

  let wxCount = {木:0,火:0,土:0,金:0,水:0};
  [yearTG,monthTG,dayTG,hourTG].forEach(g=>{if(WU_XING_GAN[g])wxCount[WU_XING_GAN[g]]++});
  [yearDZ,monthDZ,dayDZ,hourDZ].forEach(z=>{if(WU_XING_ZHI[z])wxCount[WU_XING_ZHI[z]]++});

  const riGan = dayTG;
  let shishen = {};
  if (SHISHEN[riGan]) {
    shishen = {year:SHISHEN[riGan][yearTG]||'',month:SHISHEN[riGan][monthTG]||'',day:'日主',hour:SHISHEN[riGan][hourTG]||''};
  }

  return {
    solar: year+'年'+month+'月'+day+'日', lunarInfo:'',
    lunarYear:'',lunarMonth:'',lunarDay:'',
    lunarMonthNum:month, lunarDayNum:day,
    yearGanZhi:yearGZ, monthGanZhi:monthGZ, dayGanZhi:dayGZ, hourGanZhi:hourGZ,
    yearTG, yearDZ, monthTG, monthDZ, dayTG, dayDZ, hourTG, hourDZ,
    wuxing:wxCount, shishen, nayin:{year:getNayin(yearGZ),month:getNayin(monthGZ),day:getNayin(dayGZ),hour:getNayin(hourGZ)},
    shengxiao:SHENG_XIAO[DI_ZHI.indexOf(yearDZ)]||'',
    riyuan:WU_XING_GAN[riGan]||'',
    hiddenStems:{year:DI_ZHI_HIDDEN[yearDZ]||[],month:DI_ZHI_HIDDEN[monthDZ]||[],day:DI_ZHI_HIDDEN[dayDZ]||[],hour:DI_ZHI_HIDDEN[hourDZ]||[]}
  };
}

// ========== 袁天罡称骨 CALCULATION ==========
function calcBoneWeight(bazi) {
  // Year weight from 干支
  const yearGZ = bazi.yearGanZhi;
  const yearWeight = BONE_YEAR_WEIGHTS[yearGZ] || 8;

  // Month weight (lunar month, 1-based to 0-based index)
  const monthNum = bazi.lunarMonthNum || 1;
  const monthWeight = BONE_MONTH_WEIGHTS[Math.abs(monthNum) - 1] || 6;

  // Day weight (lunar day, 1-based to 0-based index)
  const dayNum = bazi.lunarDayNum || 1;
  const dayWeight = BONE_DAY_WEIGHTS[Math.min(Math.abs(dayNum) - 1, 29)] || 5;

  // Hour weight (from 地支 of hour pillar)
  const hourDZ = bazi.hourDZ;
  const hourIdx = DI_ZHI.indexOf(hourDZ);
  const hourWeight = hourIdx >= 0 ? BONE_HOUR_WEIGHTS[hourIdx] : 8;

  const totalQian = yearWeight + monthWeight + dayWeight + hourWeight;
  const liang = Math.floor(totalQian / 10);
  const qian = totalQian % 10;

  // Find poem
  const totalStr = String(totalQian);
  let poem = '';
  // Search for the closest match
  const poemKeys = Object.keys(BONE_POEMS).map(Number).sort((a,b) => a - b);
  let matchedKey = poemKeys[0];
  for (const key of poemKeys) {
    if (key <= totalQian) matchedKey = key;
    if (key > totalQian) break;
  }
  poem = BONE_POEMS[String(matchedKey)] || '此命推来福泽深，一生衣禄自然丰，荣华富贵天注定，安享太平乐无穷。';

  return {
    yearWeight, monthWeight, dayWeight, hourWeight,
    totalQian, liang, qian,
    poem,
    yearGZ, hourDZ,
    monthDisplay: monthNum + '月',
    dayDisplay: bazi.lunarDay || (dayNum + '日')
  };
}

function formatBoneWeight(totalQian) {
  const liang = Math.floor(totalQian / 10);
  const qian = totalQian % 10;
  let result = '';
  if (liang > 0) result += liang + '两';
  if (qian > 0) result += qian + '钱';
  return result || '0钱';
}

// ========== ZI WEI DOU SHU ==========
function calcZiwei(year, month, day, hour, gender) {
  const lunarMonth = month;
  const hourIdx = Math.floor((hour + 1) / 2) % 12;
  const lifePalaceIdx = (lunarMonth - 1 + hourIdx) % 12;
  const ziweiPos = (lunarMonth + hourIdx) % 12;
  const tianfuPos = (12 - ziweiPos) % 12;

  let palaces = [];
  for (let i = 0; i < 12; i++) {
    const palaceName = ZIWEI_PALACES[i];
    let stars = [];
    if (i === ziweiPos) stars.push('紫微');
    if (i === (ziweiPos + 1) % 12) stars.push('天机');
    if (i === (ziweiPos + 2) % 12) stars.push('太阳');
    if (i === (ziweiPos + 3) % 12) stars.push('武曲');
    if (i === (ziweiPos + 4) % 12) stars.push('天同');
    if (i === (ziweiPos + 5) % 12) stars.push('廉贞');
    if (i === tianfuPos) stars.push('天府');
    if (i === (tianfuPos + 1) % 12) stars.push('太阴');
    if (i === (tianfuPos + 2) % 12) stars.push('贪狼');
    if (i === (tianfuPos + 3) % 12) stars.push('巨门');
    if (i === (tianfuPos + 4) % 12) stars.push('天相');
    if (i === (tianfuPos + 5) % 12) stars.push('天梁');
    if (i === (tianfuPos + 6) % 12) stars.push('七杀');
    if (i === (tianfuPos + 10) % 12) stars.push('破军');

    const isLife = (i === lifePalaceIdx);
    palaces.push({name:palaceName, stars, isLife});
  }

  const yearStem = TIAN_GAN[(year - 4) % 10];
  const sihua = SI_HUA[yearStem] || SI_HUA['甲'];

  return {palaces, sihua, lifePalace: lifePalaceIdx, yearStem};
}

function liuyaoToss() {
  if (liuyaoState.lines.length >= 6) return;
  const btn = document.getElementById('liuyaoBtn');
  btn.disabled = true;

  const coins = [0,1,2].map(i => document.getElementById('coin' + i));
  coins.forEach(c => { c.classList.add('flipping'); c.textContent = '?'; });

  setTimeout(() => {
    const coinValues = [Math.random() > 0.5 ? 3 : 2, Math.random() > 0.5 ? 3 : 2, Math.random() > 0.5 ? 3 : 2];
    const sum = coinValues.reduce((a,b) => a+b, 0);

    coins.forEach((c, i) => {
      c.classList.remove('flipping');
      if (coinValues[i] === 3) {
        c.className = 'coin yang';
        c.textContent = '阳';
      } else {
        c.className = 'coin yin';
        c.textContent = '阴';
      }
    });

    liuyaoState.lines.push({
      value: sum,
      isYang: sum % 2 === 1,
      isChanging: sum === 6 || sum === 9
    });

    if (liuyaoState.lines.length === 6) {
      const lines = liuyaoState.lines;
      const upperLines = lines.slice(3, 6);
      const lowerLines = lines.slice(0, 3);

      function trigramFromLines(ls) {
        const binary = ls.map(l => l.isYang ? 1 : 0).join('');
        const trigramMap = {'111':'乾','011':'兑','101':'离','001':'震','110':'巽','010':'坎','100':'艮','000':'坤'};
        return trigramMap[binary] || '乾';
      }

      const upperGua = trigramFromLines(upperLines);
      const lowerGua = trigramFromLines(lowerLines);
      const hexKey = upperGua + lowerGua;
      const hexName = HEXAGRAM_NAMES[hexKey] || (upperGua + lowerGua + '卦');
      const changingLines = lines.map((l, i) => l.isChanging ? i + 1 : null).filter(Boolean);

      liuyaoState.result = {
        lines, upperGua, lowerGua, hexName, changingLines,
        upperSymbol: BA_GUA_SYMBOL[upperGua],
        lowerSymbol: BA_GUA_SYMBOL[lowerGua],
        interpretation: '得卦【' + hexName + '】，' + (changingLines.length > 0 ? '变爻在第' + changingLines.join('、') + '爻' : '无变爻，为静卦') + '。' +
          upperGua + '为外卦，' + lowerGua + '为内卦。卦象显示：当前形势需要审时度势，把握时机。'
      };
      allResults.liuyao = liuyaoState.result;
    }

    const panel = document.getElementById('detailPanel');
    panel.innerHTML = renderLiuyaoInteractive();
  }, 600);
}

        <div style="margin-top:20px">
          <button class="btn-interactive" onclick="beginTarotDraw()">开始抽牌</button>
        </div>
      </div>`;
  }

  if (tarotState.phase === 'draw') {
    const positions = tarotState.spread === 1 ? ['指引'] :
      tarotState.spread === 3 ? ['过去','现在','未来'] :
      ['现状','挑战','过去','近期未来','意识','潜意识','建议','外在影响','希望与恐惧','最终结果'];

    const cardsHtml = tarotState.drawn.map((c, i) => {
      const isRevealed = i < tarotState.revealed;
      return `
        <div class="tarot-card">
          <div class="card-pos">${positions[i]}</div>
          <div class="card-inner ${isRevealed ? 'flipped' : ''}" onclick="revealTarotCard(${i})">
            <div class="card-face card-back">${i < tarotState.revealed ? '' : '🃏'}</div>
            <div class="card-face card-front">
              <span style="font-size:1.2rem">${c.symbol}</span>
              <span style="font-size:.75rem;color:var(--cyan);margin-top:4px">${c.name}</span>
              <span style="font-size:.65rem;color:var(--text3)">${c.reversed ? '逆位' : '正位'}</span>
            </div>
          </div>
          <div class="card-name">${isRevealed ? c.name : '???'}</div>
          <div class="card-meaning">${isRevealed ? (c.reversed ? '逆位' : '正位') : ''}</div>
        </div>`;
    }).join('');

    return `
      <div class="detail-title">塔罗占卜</div>
      <div class="detail-section">
        <h4>${tarotState.spread === 1 ? '单牌指引' : tarotState.spread === 3 ? '三牌阵 - 过去·现在·未来' : '凯尔特十字牌阵'}</h4>
        <p style="color:var(--text3);font-size:.85rem;margin-bottom:12px">点击卡牌翻开（${tarotState.revealed}/${tarotState.drawn.length}）</p>
        <div class="tarot-spread">${cardsHtml}</div>
      </div>
      ${tarotState.revealed >= tarotState.drawn.length ? renderTarotSummary() : ''}`;
  }

  return '';
}

function selectSpread(n) {
  tarotState.spread = n;
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = renderTarotInteractive();
}

function beginTarotDraw() {
  const deck = [...tarotState.deck];
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }

  tarotState.drawn = deck.slice(0, tarotState.spread).map(c => ({
    ...c,
    reversed: Math.random() > 0.6,
    meaning: Math.random() > 0.6 ? c.reversedMeaning || c.meaning : c.meaning
  }));
  tarotState.revealed = 0;
  tarotState.phase = 'draw';
  allResults.tarot = {cards: tarotState.drawn};

  const panel = document.getElementById('detailPanel');
  panel.innerHTML = renderTarotInteractive();
}

function revealTarotCard(idx) {
  if (idx !== tarotState.revealed) return;
  tarotState.revealed++;
  const panel = document.getElementById('detailPanel');
  panel.innerHTML = renderTarotInteractive();
}

function renderTarotSummary() {
  const positions = tarotState.spread === 1 ? ['指引'] :
    tarotState.spread === 3 ? ['过去','现在','未来'] :
    ['现状','挑战','过去','近期未来','意识','潜意识','建议','外在影响','希望与恐惧','最终结果'];

  const detailHtml = tarotState.drawn.map((c, i) => `
    <div class="detail-row" style="flex-direction:column;gap:4px;padding:10px 0">
      <span style="color:var(--cyan);font-weight:600">【${positions[i]}】${c.name} ${c.reversed ? '（逆位）' : ''}</span>
      <span style="color:var(--text2);font-size:.85rem">${c.meaning}</span>

  return `
    <div class="detail-section">

// ========== CALENDAR (for bazi results) ==========
function calcCalendar(year, month, day) {
  try {
    const Solar = window.Solar || (typeof lunar !== 'undefined' && lunar.Solar);
    let lunarInfo = null;
    if (Solar && Solar.fromYmd) {
      const solar = Solar.fromYmd(year, month, day);
      lunarInfo = solar.getLunar ? solar.getLunar() : null;
    }

    const monthZhiIdx = (month + 1) % 12;
    const dayOffset = Math.floor((new Date(year, month-1, day) - new Date(year, 0, 1)) / 86400000);
    const officerIdx = dayOffset % 12;
    const mansionIdx = dayOffset % 28;
    const officer = TWELVE_OFFICERS[officerIdx];
    const mansion = TWENTY_EIGHT_MANSIONS[mansionIdx];
    const auspicious = AUSPICIOUS_ACTIVITIES[officer] || ['祈福'];

    let yi = [], ji = [];
    if (lunarInfo && lunarInfo.getDayYi) {
      try { yi = lunarInfo.getDayYi(); } catch(e) {}
      try { ji = lunarInfo.getDayJi(); } catch(e) {}
    }
    if (!yi.length) yi = auspicious.concat(['祭祀','祈福','出行','嫁娶','开业'].slice(0,3));
    if (!ji.length) ji = ['动土','安葬','破土','诉讼','远行'].slice(0,3);

    return {
      lunarDate: lunarInfo ? '农历' + lunarInfo.getMonthInChinese() + '月' + lunarInfo.getDayInChinese() : '农历' + month + '月' + day + '日',
      lunarMonth: lunarInfo ? lunarInfo.getMonthInChinese() + '月' : month + '月',
      lunarDay: lunarInfo ? lunarInfo.getDayInChinese() : day + '日',
      officer, mansion,
      jianchu: officer + '日',
      ershiba: mansion + '宿',
      yi, ji,
      wuxing: BA_GUA_WUXING[BA_GUA[dayOffset % 8]] || '土',
      chong: DI_ZHI[(DI_ZHI.indexOf(DI_ZHI[monthZhiIdx]) + 6) % 12] + '煞',
      interpretation: '今日值' + officer + '，' + mansion + '宿当值。' +
        '宜：' + auspicious.join('、') + '。' +
        (officer === '成' || officer === '开' ? '今日为黄道吉日，诸事皆宜。' :
         officer === '破' || officer === '危' ? '今日需谨慎行事，不宜大动。' : '今日运势平稳，按部就班为佳。')
    };
  } catch(e) {
    return calcCalendarManual(year, month, day);
  }
}

function calcCalendarManual(year, month, day) {
  const dayOffset = Math.floor((new Date(year, month-1, day) - new Date(year, 0, 1)) / 86400000);
  const officerIdx = dayOffset % 12;
  const mansionIdx = dayOffset % 28;
  const officer = TWELVE_OFFICERS[officerIdx];
  const mansion = TWENTY_EIGHT_MANSIONS[mansionIdx];
  const auspicious = AUSPICIOUS_ACTIVITIES[officer] || ['祈福'];
  return {
    lunarDate:'农历'+month+'月'+day+'日', lunarMonth:month+'月', lunarDay:day+'日',
    officer, mansion, jianchu:officer+'日', ershiba:mansion+'宿',
    yi:auspicious.concat(['祭祀','祈福','出行']), ji:['动土','安葬','破土'],
    wuxing:'土', chong:'煞',
    interpretation:'今日值'+officer+'，'+mansion+'宿当值。宜：'+auspicious.join('、')+'。'
  };
}

// ========== 万年历 MODULE ==========
function renderWanNianLi() {
  const container = document.getElementById('wnlContainer');
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();

  // Navigation header
  let html = `
    <div class="wnl-header">
      <div class="wnl-nav">
        <button onclick="wnlNavigate(-1)">◀</button>
      </div>
      <h3 id="wnlTitle">${wnlCurrentYear}年${wnlCurrentMonth}月</h3>
      <div class="wnl-nav">
        <button onclick="wnlNavigate(1)">▶</button>
      </div>
    </div>
    <div style="text-align:center;margin-bottom:12px">
      <button class="btn-retry" onclick="wnlGoToday()" style="font-size:.78rem;padding:6px 16px">📅 回到今天</button>
    </div>`;

  // Weekday headers
  const weekdays = ['日','一','二','三','四','五','六'];
  html += '<div class="wnl-weekdays">';
  weekdays.forEach(w => {
    html += '<div class="wnl-weekday">' + w + '</div>';
  });
  html += '</div>';

  // Calendar days grid
  html += '<div class="wnl-days">';

  const firstDay = new Date(wnlCurrentYear, wnlCurrentMonth - 1, 1);
  const lastDay = new Date(wnlCurrentYear, wnlCurrentMonth, 0);
  const startDayOfWeek = firstDay.getDay();
  const daysInMonth = lastDay.getDate();

  // Previous month days
  const prevMonthLast = new Date(wnlCurrentYear, wnlCurrentMonth - 1, 0).getDate();
  for (let i = startDayOfWeek - 1; i >= 0; i--) {
    const d = prevMonthLast - i;
    const m = wnlCurrentMonth === 1 ? 12 : wnlCurrentMonth - 1;
    const y = wnlCurrentMonth === 1 ? wnlCurrentYear - 1 : wnlCurrentYear;
    html += renderWnlDay(y, m, d, true);
  }

  // Current month days
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = (wnlCurrentYear === today.getFullYear() && wnlCurrentMonth === today.getMonth() + 1 && d === today.getDate());
    const dateKey = wnlCurrentYear + '-' + wnlCurrentMonth + '-' + d;
    const isSelected = (wnlSelectedDay === dateKey);
    html += renderWnlDay(wnlCurrentYear, wnlCurrentMonth, d, false, isToday, isSelected);
  }

  // Next month days to fill grid
  const totalCells = startDayOfWeek + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= remaining; d++) {
    const m = wnlCurrentMonth === 12 ? 1 : wnlCurrentMonth + 1;
    const y = wnlCurrentMonth === 12 ? wnlCurrentYear + 1 : wnlCurrentYear;
    html += renderWnlDay(y, m, d, true);
  }

  html += '</div>';

  // Detail panel
  html += '<div class="wnl-detail" id="wnlDetail"></div>';

  container.innerHTML = html;

  // If a day was selected, show its detail
  if (wnlSelectedDay) {
    const parts = wnlSelectedDay.split('-');
    showWnlDetail(parseInt(parts[0]), parseInt(parts[1]), parseInt(parts[2]));
  }
}

function renderWnlDay(year, month, day, otherMonth, isToday, isSelected) {

    const Solar = window.Solar || (typeof lunar !== 'undefined' && lunar.Solar);
    if (Solar && Solar.fromYmd) {
      const solar = Solar.fromYmd(year, month, day);
      const lunar = solar.getLunar();
      lunarDateStr = lunar.getMonthInChinese() + '月' + lunar.getDayInChinese();
      try { yi = lunar.getDayYi() || []; } catch(e) {}
      try { ji = lunar.getDayJi() || []; } catch(e) {}
    }

  const dateKey = year + '-' + month + '-' + day;
  let cls = 'wnl-day';
  if (otherMonth) cls += ' other-month';
  if (isToday) cls += ' today';
  if (isSelected) cls += ' selected';

  let dots = '';
  if (!otherMonth && (yi.length > 0 || ji.length > 0)) {
    dots = '<div class="yi-ji-dots">';

    if (ji.length > 0) dots += '<div class="ji-dot"></div>';

  // Highlight special lunar dates
  let lunarDisplay = lunarDateStr;
  if (lunarDateStr === '正月初一') lunarDisplay = '春节';
  else if (lunarDateStr === '正月十五') lunarDisplay = '元宵';
  else if (lunarDateStr === '五月初五') lunarDisplay = '端午';
  else if (lunarDateStr === '七月十五') lunarDisplay = '中元';
  else if (lunarDateStr === '八月十五') lunarDisplay = '中秋';
  else if (lunarDateStr === '九月初九') lunarDisplay = '重阳';
  else if (lunarDateStr === '除夕') lunarDisplay = '除夕';

  return '<div class="' + cls + '" onclick="wnlSelectDay(' + year + ',' + month + ',' + day + ')">' +
    '<div class="solar-date">' + day + '</div>' +
    '<div class="lunar-date">' + lunarDisplay + '</div>' +
    dots +
    '</div>';
}

function getJiShi(dayGZ) {
  if (!dayGZ || dayGZ.length < 2) return '';
  const dayTG = dayGZ[0];
  // 吉时 based on 日干 (甲己起甲子，乙庚起丙子，丙辛起戊子，丁壬起庚子，戊癸起壬子)
  const startMap = {甲:0,己:0,乙:2,庚:2,丙:4,辛:4,丁:6,壬:6,戊:8,癸:8};
  const startIdx = startMap[dayTG];
  if (startIdx === undefined) return '';

  // 子时到亥时的天干
  const hourGans = [];
  for (let i = 0; i < 12; i++) {
    hourGans.push(TIAN_GAN[(startIdx + i) % 10]);
  }

  // 吉时 = 青龙、明堂、朱雀、金匮、天德、玉堂 对应的时辰
  // Simplified: show the auspicious hours based on traditional method
  // For simplicity, we mark 子、丑、辰、巳、未、戌 as generally auspicious
  const jiHours = [];
  const hourNames = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  const auspiciousIdx = [0, 1, 4, 5, 7, 10]; // 子丑辰巳未戌
  auspiciousIdx.forEach(idx => {
    jiHours.push(hourGans[idx] + hourNames[idx] + '时');
  });
  return jiHours.join('、');
}

// ========== RENDER FUNCTIONS ==========
function renderBazi(bazi) {
  const elements = Object.entries(bazi.wuxing).map(([k,v]) =>

  // 黄历 info integrated into bazi
  let calendarHtml = '';

    const c = allResults.calendar;
    const yiTags = c.yi.slice(0,6).map(y => '<span class="wnl-yi-tag">' + y + '</span>').join('');
    const jiTags = c.ji.slice(0,4).map(j => '<span class="wnl-ji-tag">' + j + '</span>').join('');
    calendarHtml = `
      <div class="detail-section">
        <h4>📅 今日黄历</h4>
        <div class="detail-row"><span class="label">农历</span><span class="value">${c.lunarDate}</span></div>
        <div class="detail-row"><span class="label">建除</span><span class="value"><span class="tag tag-cyan">${c.jianchu}</span></span></div>
        <div class="detail-row"><span class="label">星宿</span><span class="value"><span class="tag tag-purple">${c.ershiba}</span></span></div>
        <div class="detail-row"><span class="label">五行</span><span class="value"><span class="tag ${getTagClassForElement(c.wuxing)}">${c.wuxing}</span></span></div>
        <div style="margin-top:10px">
          <div style="font-size:.82rem;color:#10b981;margin-bottom:4px">✅ 宜</div>
          <div class="wnl-yi-list">${yiTags}</div>
        </div>
        <div style="margin-top:8px">
          <div style="font-size:.82rem;color:#ef4444;margin-bottom:4px">❌ 忌</div>

    const bw = allResults.boneWeight;
    boneHtml = `

        <h4>🦴 袁天罡称骨</h4>
        <div class="bone-weight-card">

            <div class="bone-detail-cell">

            </div>
            <div class="bone-detail-cell">
              <div class="bone-label">月重</div>
              <div class="bone-value">${bw.monthDisplay}</div>
              <div class="bone-weight">${formatBoneWeight(bw.monthWeight)}</div>
            </div>
            <div class="bone-detail-cell">
              <div class="bone-label">日重</div>
              <div class="bone-value">${bw.dayDisplay}</div>
              <div class="bone-weight">${formatBoneWeight(bw.dayWeight)}</div>
            </div>
            <div class="bone-detail-cell">
              <div class="bone-label">时重</div>

            </div>

      <div class="detail-row"><span class="label">日柱</span><span class="value">${bazi.nayin.day}</span></div>

}

function renderZiwei(data) {
  let palacesHtml = '<div class="star-grid">';
  data.palaces.forEach(p => {
    const starsHtml = p.stars.map(s => {
      let cls = 'tag-blue';
      if (['紫微','天府','天相','天梁','天同'].includes(s)) cls = 'tag-purple';
      if (['七杀','破军','贪狼','廉贞'].includes(s)) cls = 'tag-red';
      if (data.sihua && s === data.sihua.禄) cls += ' tag-yellow';
      return '<span class="tag ' + cls + '">' + s + '</span>';
    }).join('');
    palacesHtml += '<div class="star-cell"' + (p.isLife ? ' style="border-color:var(--cyan)"' : '') + '>';
    palacesHtml += '<div class="palace-name">' + (p.isLife ? '★ ' : '') + p.name + '</div>';
    palacesHtml += starsHtml;
    palacesHtml += '</div>';
  });
  palacesHtml += '</div>';

  const sihuaHtml = data.sihua ? Object.entries(data.sihua).map(([k,v]) =>
    '<span class="tag tag-purple">' + k + '：' + v + '</span>'
  ).join(' ') : '';

  return `
    <div class="detail-title">紫微斗数</div>
    <div class="detail-section">
      <h4>年干四化 (${data.yearStem})</h4>
      <div class="element-bar">${sihuaHtml}</div>
    </div>
    <div class="detail-section">
      <h4>十二宫星曜分布</h4>
      ${palacesHtml}
    </div>
    <div class="detail-section">
      <h4>命盘解读</h4>
      <p style="font-size:.88rem;line-height:1.8;color:var(--text2)">
        命宫位于${ZIWEI_PALACES[data.lifePalace]}，${data.palaces[data.lifePalace].stars.length > 0 ?
        '主星为' + data.palaces[data.lifePalace].stars.join('、') + '。' :
        '无主星坐守，借对宫星曜之力。'}
        四化飞星中，化禄主财，化权主权势，化科主名声，化忌主阻碍。
        综合来看，命盘格局需要结合大运流年综合分析。
      </p>
    </div>`;
}

function renderHexLines(gua) {
  const lines = {
    乾:[1,1,1],兑:[0,1,1],离:[1,0,1],震:[0,0,1],
    巽:[1,1,0],坎:[0,1,0],艮:[1,0,0],坤:[0,0,0]
  };
  const ls = lines[gua] || [1,1,1];
  return ls.map(l => l ?
    '<div class="hexagram-line yang"></div>' :
    '<div class="hexagram-line yin"><span></span><span></span></div>'
  ).join('');
}

// ========== MAIN FLOW ==========
async function startAnalysis() {
  const year = parseInt(document.getElementById('birthYear').value);
  const month = parseInt(document.getElementById('birthMonth').value);
  const day = parseInt(document.getElementById('birthDay').value);
  const hourStr = document.getElementById('birthHour').value;
  const gender = document.getElementById('gender').value;
  const minute = parseInt(document.getElementById('birthMinute').value) || 0;

  if (!year || !month || !day || hourStr === '') {
    alert('请填写完整的出生信息');
    return;
  }
  const hour = parseInt(hourStr);

  document.getElementById('inputScreen').style.display = 'none';
  const loading = document.getElementById('loadingScreen');
  loading.classList.add('active');

  const steps = document.querySelectorAll('#progressSteps .step');

  await delay(400);
  steps[0].classList.add('active');
  allResults.bazi = calcBazi(year, month, day, hour);
  // Calculate bone weight
  allResults.boneWeight = calcBoneWeight(allResults.bazi);
  await delay(600);
  steps[0].classList.remove('active');
  steps[0].classList.add('done');

  steps[1].classList.add('active');
  allResults.ziwei = calcZiwei(year, month, day, hour, gender);
  await delay(500);
  steps[1].classList.remove('active');
  steps[1].classList.add('done');

  steps[2].classList.add('active');
  meihuaState = {active: false, numbers: [], result: null};
  await delay(400);
  steps[2].classList.remove('active');
  steps[2].classList.add('done');

  steps[3].classList.add('active');
  liuyaoState = {active: false, lines: [], result: null};
  await delay(500);
  steps[3].classList.remove('active');
  steps[3].classList.add('done');

  steps[4].classList.add('active');
  allResults.calendar = calcCalendar(year, month, day);
  await delay(400);
  steps[4].classList.remove('active');
  steps[4].classList.add('done');

  steps[5].classList.add('active');
  tarotState = {phase: 'select', spread: 3, deck: getFullTarotDeck(), drawn: [], revealed: 0};
  await delay(500);
  steps[5].classList.remove('active');
  steps[5].classList.add('done');

  await delay(300);

  loading.classList.remove('active');
  document.getElementById('resultsScreen').classList.add('active');

  const score = 80 + Math.floor(Math.random() * 10);
  document.getElementById('confidenceScore').textContent = score + '%';

  switchTab('bazi');
  startAIAnalysis();
}

function switchTab(method) {
  document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('active'));
  const tab = document.querySelector('.method-tab[data-method="' + method + '"]');
  if (tab) tab.classList.add('active');

  const panel = document.getElementById('detailPanel');
  const renderers = {
    bazi: renderBazi,
    ziwei: renderZiwei,
    meihua: renderMeihuaInteractive,
    liuyao: renderLiuyaoInteractive,
    tarot: renderTarotInteractive
  };

  if (renderers[method]) {
    if ((method === 'bazi' || method === 'ziwei') && allResults[method]) {
      panel.innerHTML = renderers[method](allResults[method]);
    } else if (method === 'meihua') {
      panel.innerHTML = renderers[method]();
    } else if (method === 'liuyao') {
      panel.innerHTML = renderers[method]();
    } else if (method === 'tarot') {
      panel.innerHTML = renderers[method]();
    }
  }
}

// ========== AI INTEGRATION (Results) ==========
async function startAIAnalysis() {
  const aiContent = document.getElementById('aiContent');
  aiContent.innerHTML = '<span class="cursor"></span>';

  const summary = buildAnalysisSummary();

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: API_MODEL,
        messages: [
          {role: 'system', content: '你是万象合参AI命理分析系统。基于以下6种术数的分析结果，给出综合的命运解读。请用中文回答，分析要有深度，涵盖事业、财运、感情、健康等方面。回复控制在800字以内。用emoji。'},
          {role: 'user', content: summary}
        ],
        stream: true,
        max_tokens: 2000,
        temperature: 0.7
      })
    });

    if (!response.ok) throw new Error('API error: ' + response.status);

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let text = '';
    let buffer = '';
    let inThink = false;

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;

        try {
          const json = JSON.parse(data);
          const delta = json.choices?.[0]?.delta?.content || '';
          if (!delta) continue;

          for (let i = 0; i < delta.length; i++) {
            if (delta[i] === '<') {
              if (delta.substring(i, i+7) === '<think>') { inThink = true; i += 6; continue; }
              if (delta.substring(i, i+8) === '</think>') { inThink = false; i += 7; continue; }
            }
            if (!inThink) {
              text += delta[i];
              aiContent.innerHTML = text.replace(/\n/g, '<br>') + '<span class="cursor"></span>';
              await new Promise(r => setTimeout(r, 20));
            }
          }
        } catch(e) {}
      }
    }
    aiContent.innerHTML = text.replace(/\n/g, '<br>');
  } catch(e) {
    console.error('AI Error:', e);
    aiContent.innerHTML = buildLocalAnalysis();
  }
}

function buildAnalysisSummary() {
  let s = '【万象合参 - 六术分析数据】\n\n';

  if (allResults.bazi) {
    const b = allResults.bazi;
    s += '一、八字命理\n';
    s += '四柱：' + b.yearGanZhi + ' ' + b.monthGanZhi + ' ' + b.dayGanZhi + ' ' + b.hourGanZhi + '\n';
    s += '日元：' + b.dayTG + '（' + b.riyuan + '）\n';
    s += '五行：' + Object.entries(b.wuxing).map(([k,v])=>k+v).join(' ') + '\n';
    s += '十神：年' + b.shishen.year + ' 月' + b.shishen.month + ' 日' + b.shishen.day + ' 时' + b.shishen.hour + '\n';
    s += '纳音：' + b.nayin.year + ' ' + b.nayin.month + ' ' + b.nayin.day + ' ' + b.nayin.hour + '\n\n';
  }

  if (allResults.boneWeight) {
    const bw = allResults.boneWeight;
    s += '二、袁天罡称骨\n';
    s += '骨重：' + formatBoneWeight(bw.totalQian) + '（' + bw.totalQian + '钱）\n';
    s += '年重' + formatBoneWeight(bw.yearWeight) + ' 月重' + formatBoneWeight(bw.monthWeight) + ' 日重' + formatBoneWeight(bw.dayWeight) + ' 时重' + formatBoneWeight(bw.hourWeight) + '\n';
    s += '批语：' + bw.poem + '\n\n';
  }

  if (allResults.ziwei) {
    const z = allResults.ziwei;
    s += '三、紫微斗数\n';
    s += '命宫主星：' + (z.palaces[z.lifePalace].stars.join('、') || '无主星') + '\n';
    s += '四化：' + Object.entries(z.sihua).map(([k,v])=>k+':'+v).join(' ') + '\n\n';
  }

  if (allResults.meihua) {
    const m = allResults.meihua;
    s += '四、梅花易数\n';
    s += '卦象：' + m.hexName + '\n';
    s += '体卦：' + m.tiGua + '（' + m.tiWX + '）用卦：' + m.yongGua + '（' + m.yongWX + '）\n';
    s += '关系：' + m.relationship + '\n';
    s += '解读：' + m.interpretation + '\n\n';
  }

  if (allResults.liuyao) {
    const l = allResults.liuyao;
    s += '五、六爻占卜\n';
    s += '卦象：' + l.hexName + '\n';
    s += '变爻：' + (l.changingLines.length > 0 ? '第' + l.changingLines.join('、') + '爻' : '无') + '\n\n';
  }

  if (allResults.calendar) {
    const c = allResults.calendar;
    s += '六、黄历择吉\n';
    s += c.lunarDate + ' ' + c.jianchu + ' ' + c.ershiba + '\n';
    s += '宜：' + c.yi.slice(0,5).join('、') + '\n\n';
  }

  if (allResults.tarot) {
    const t = allResults.tarot;
    s += '七、塔罗占卜\n';
    t.cards.forEach(c => {
      s += '：' + c.name + (c.reversed?'（逆位）':'') + ' - ' + c.meaning + '\n';
    });
  }

  return s;
}

function buildLocalAnalysis() {
  let analysis = '【万象合参综合分析】\n\n';

  if (allResults.bazi) {
    const b = allResults.bazi;
    const wxMax = Object.entries(b.wuxing).sort((a,b) => b[1] - a[1])[0];
    const wxMin = Object.entries(b.wuxing).sort((a,b) => a[1] - b[1])[0];
    analysis += '命主日元为' + b.dayTG + '（' + b.riyuan + '），八字中' + wxMax[0] + '旺' + wxMin[0] + '弱。';

    if (b.shishen.month === '正官' || b.shishen.month === '七杀') {
      analysis += '月柱透官杀，事业心强，适合管理岗位。';
    } else if (b.shishen.month === '正财' || b.shishen.month === '偏财') {
      analysis += '月柱透财星，理财能力佳，适合经商或金融。';
    } else if (b.shishen.month === '食神' || b.shishen.month === '伤官') {
      analysis += '月柱透食伤，才华出众，适合创意、技术类工作。';
    }
    analysis += '\n\n';
  }

  if (allResults.boneWeight) {
    const bw = allResults.boneWeight;
    analysis += '【袁天罡称骨】骨重' + formatBoneWeight(bw.totalQian) + '，' + bw.poem + '\n\n';
  }

  if (allResults.meihua) {
    analysis += '梅花易数得' + allResults.meihua.hexName + '，' + allResults.meihua.interpretation + '\n\n';
  }

  analysis += '综合六术分析，命主当前运势整体平稳，宜把握机遇，稳中求进。事业方面可大胆拓展，感情方面需多加沟通，健康方面注意劳逸结合。';

  return analysis;
}

function goBack() {
  document.getElementById('resultsScreen').classList.remove('active');
  document.getElementById('inputScreen').style.display = 'block';
  allResults = {};
  meihuaState = {active: false, numbers: [], result: null};
  liuyaoState = {active: false, lines: [], result: null};
  tarotState = {phase: 'select', spread: 3, deck: [], drawn: [], revealed: 0};
  document.getElementById('aiContent').innerHTML = '<span class="cursor"></span>';

  // Reset progress steps
  document.querySelectorAll('#progressSteps .step').forEach(s => {
    s.classList.remove('active', 'done');
  });
}
